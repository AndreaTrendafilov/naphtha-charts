# Values passed to the upstream `rocketchat` subchart (Chart.yaml dependency).
# Upstream reference: https://github.com/RocketChat/helm-charts
rocketchat:
  image:
    repository: registry.rocket.chat/rocketchat/rocket.chat
    tag: "8.2.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  host: chat.naphtha.dev

  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    path: /
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls:
      - secretName: rocketchat-tls
        hosts:
          - chat.naphtha.dev

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

  mongodb:
    enabled: true
    architecture: replicaset
    replicaCount: 1
    auth:
      enabled: true
      usernames:
        - rocketchat
      databases:
        - rocketchat
    persistence:
      enabled: true
      size: 20Gi
    arbiter:
      enabled: false
