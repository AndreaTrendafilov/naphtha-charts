## Single-node KRaft (combined broker+controller). Chart supports one replica only.
## Image: https://hub.docker.com/r/apache/kafka — JVM image from the Apache Kafka project.

image:
  repository: apache/kafka
  tag: "4.2.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 9092

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  ## KRaft log + metadata under this path (KAFKA_LOG_DIRS)
  mountPath: /var/lib/kafka/kraft-combined-logs

## Stable id for the KRaft cluster directory. Change only when creating a brand-new cluster.
kraft:
  clusterId: "4L6g3nShT-eMCtK--X86sw"

## Optional extra broker settings (KAFKA_* env — see Apache docker README).
extraEnv: []
# - name: KAFKA_LOG_RETENTION_HOURS
#   value: "168"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

## Official JVM image runs as uid/gid 1000 (appuser)
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
