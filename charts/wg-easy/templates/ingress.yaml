{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wg-easy.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  {{- if or .Values.ingress.className .Values.ingress.annotations }}
  annotations:
    {{- with .Values.ingress.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- /* Primary host */ -}}
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wg-easy.fullname" . }}-ui
                port:
                  number: {{ $.Values.service.ui.port | default 51821 }}
    {{- /* Optional extra hosts */ -}}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "wg-easy.fullname" $ }}-ui
                port:
                  number: {{ $.Values.service.ui.ports.http | default 51821 }}
    {{- end }}
{{- end }}

