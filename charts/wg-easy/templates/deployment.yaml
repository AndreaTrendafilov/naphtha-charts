apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: {{ .Release.Namespace }}
  labels:
    app: wireguard
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: wireguard
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: vpn
              containerPort: {{ .Values.service.vpnPort }}
              protocol: UDP
            - name: web
              containerPort: {{ .Values.service.webPort }}
              protocol: TCP
          env:
            # wg-easy v15 configuration - uses unattended setup
            - name: INSECURE
              value: "true"
            - name: PORT
              value: "{{ .Values.service.webPort }}"
            - name: HOST
              value: "0.0.0.0"
            - name: DISABLE_IPV6
              value: "true"
            {{- if .Values.init.enabled }}
            # Unattended setup for v15
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: "{{ .Values.init.username }}"
            - name: INIT_PASSWORD
              value: "{{ .Values.init.password }}"
            - name: INIT_HOST
              value: "{{ .Values.wireguardConfig.host }}"
            - name: INIT_PORT
              value: "{{ .Values.service.vpnPort }}"
            - name: INIT_DNS
              value: "{{ .Values.wireguardConfig.defaultDns }}"
            - name: INIT_IPV4_CIDR
              value: "{{ .Values.wireguardConfig.subnet }}"
            - name: INIT_IPV6_CIDR
              value: "{{ .Values.wireguardConfig.ipv6Subnet }}"
            {{- if .Values.wireguardConfig.allowedIPs }}
            - name: WG_DEFAULT_ALLOWED_IPS
              value: "{{ .Values.wireguardConfig.allowedIPs }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: wireguard-data
              mountPath: /etc/wireguard
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.webPort }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.webPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: wireguard-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: wireguard-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if .Values.sysctls }}
      initContainers:
        - name: sysctl-init
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              {{- range .Values.sysctls }}
              sysctl -w {{ .name }}={{ .value }}
              {{- end }}
          securityContext:
            privileged: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }} 
