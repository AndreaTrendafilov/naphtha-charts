# wireguard
wireguard:
  enabled: false

replicaCount: 1

image:
  registry: ghcr.io
  repository: wg-easy/wg-easy
  tag: "15.1.0"

service:
  type: LoadBalancer
  vpnPort: 51820
  # External port for VPN (443 for HTTPS, 80 for HTTP)
  vpnExternalPort: 443
  webPort: 51821
  # External IP configuration
  externalIP:
    enabled: false
    staticIP: null
  externalDNS:
    enabled: false
    hostname: ""
  # Web UI external DNS (for internal access)
  webExternalDNS:
    enabled: false
    hostname: ""
  # Web UI external IP configuration
  webExternalIP:
    enabled: false
    staticIP: null

ingress:
  enabled: false
  host: ""

wireguardConfig:
  # WireGuard server host - should be the public IP or domain
  host: ""
  # Default DNS servers for clients - using Azure private DNS
  defaultDns: "168.63.129.16"
  # VPN IPv4 subnet
  subnet: "10.8.0.0/24"
  # VPN IPv6 subnet (disabled due to missing kernel modules)
  ipv6Subnet: "fd42:42:42::/64"
  # Split tunneling - only route VNet subnets + DNS (NOT 0.0.0.0/0)
  allowedIPs: "10.100.0.0/16,168.63.129.16/32"

# wg-easy v15 unattended setup
init:
  enabled: true
  username: "admin"
  password: "megasecureforwireguard"

webUI:
  # Web UI language
  lang: "en"
  # Enable traffic stats
  trafficStats: true
  # Chart type (0=disabled, 1=line, 2=area, 3=bar)
  chartType: 1
  # Max age for stats in minutes
  maxAge: 1440
  # Enable Prometheus metrics
  prometheusMetrics: false

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Enable host networking for better VNet integration
hostNetwork: false

securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE
  privileged: true

podSecurityContext:
  fsGroup: 1000

sysctls:
  - name: net.ipv4.conf.all.src_valid_mark
    value: "1"
  - name: net.ipv4.ip_forward
    value: "1"
