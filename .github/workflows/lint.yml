---
name: Lint

on:
  push:
  pull_request:

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint .

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint (charts)
        run: |
          set -euo pipefail
          # rocketchat subchart is vendored under charts/rocketchat/charts/*.tgz — no helm repo add
          helm lint charts/migrations-operator
          helm lint charts/jellyfin
          helm lint charts/rocketchat
