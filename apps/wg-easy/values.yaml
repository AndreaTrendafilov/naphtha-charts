# wg-easy - values.yaml

# wireguard
wireguard:
  enabled: true

replicaCount: 1

image:
  registry: ghcr.io
  repository: wg-easy/wg-easy
  tag: "15.1.0"

# --- Unattended setup for v15+ ---
init:
  enabled: true
  username: "admin"
  password: "Very$str0ngP@ssw0rd,22"

  # Clients will connect to this DNS name (or your public IP)
  host: "vpn.naphtha.dev"

  # WireGuard public UDP port
  port: 51820

  # DNS given to peers
  dns: "1.1.1.1,8.8.8.8"

  # VPN network
  ipv4Cidr: "10.8.0.0/24"
  # ipv6Cidr: "fd00:1234:abcd::/64" # optional

env:
  # If you expose a different external UDP port than 51820,
  # set this so generated peer configs advertise the right port.
  WG_PORT: "51820"
  # WG_ALLOWED_IPS: "0.0.0.0/0, ::/0"

webUI:
  lang: "en"
  trafficStats: true
  chartType: 1
  maxAge: 1440
  prometheusMetrics: false

# Persistence (recommended)
persistence:
  enabled: true
  size: 1Gi
  # storageClassName: "local-path"  # uncomment to pin on k3s default

# --- Security / kernel requirements ---
pod:
  securityContext:
    sysctls:
      - name: net.ipv4.ip_forward
        value: "1"
      - name: net.ipv6.conf.all.forwarding
        value: "1"
  hostPaths:
    - name: lib-modules
      hostPath: /lib/modules
      mountPath: /lib/modules
      readOnly: true
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE

# --- Services ---
service:
  # WireGuard UDP service (clients connect here)
  wireguard:
    enabled: true
    type: LoadBalancer            # k3s/klipper-lb supports UDP
    externalTrafficPolicy: Local
    ports:
      - name: wireguard
        protocol: UDP
        port: 51820
        targetPort: 51820

  # Web UI service (container listens on 51821)
  ui:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 51821
        targetPort: 51821

    # OPTIONAL: expose UI on node IP :8080 (HTTP) instead of Ingress+TLS
    # type: NodePort
    # nodePort: 8080

# --- Ingress via Traefik + cert-manager (HTTPS on 443) ---
ingress:
  enabled: true
  className: "traefik"
  hostname: "wg-ui.naphtha.dev"   # UI lives on this subdomain
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    - secretName: wg-easy-tls
      hosts:
        - "wg-ui.naphtha.dev"
  rules:
    - host: "wg-ui.naphtha.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port: 51821
