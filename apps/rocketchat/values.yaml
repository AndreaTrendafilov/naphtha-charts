replicaCount: 1

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: rocketchat.naphtha.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rocketchat-tls
      hosts:
        - rocketchat.naphtha.dev

# Simple: use bundled MongoDB (switch to external later if you want)
mongodb:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    rootPassword: "change-me"
    username: "rocketchat"
    password: "change-me"
    database: "rocketchat"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
