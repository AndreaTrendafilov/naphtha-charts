# Deploy: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (GitHub Actions secrets)
#
# If naphtha.dev is Cloudflare Pages, /charts/* is still served by Pages — use
# Custom domains on this Worker: charts.naphtha.dev (see README).

name = "naphtha-helm-charts-proxy"
main = "src/index.ts"
compatibility_date = "2024-10-01"

[vars]
GITHUB_OWNER = "AndreaTrendafilov"
GITHUB_REPO = "naphtha-charts"
GITHUB_BRANCH = "main"
CHARTS_HOSTNAME = "charts.naphtha.dev"
